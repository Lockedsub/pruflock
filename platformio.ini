; PrufLock: chastitytracker inspection-code badge for the LilyGO TTGO T-Display (ESP32, CP2104, ST7789 135x240).
; Build/flash from VS Code (PlatformIO sidebar) or: ~/.platformio/penv/bin/pio run -t upload

[platformio]
default_envs = ttgo-t-display

[env:ttgo-t-display]
; pioarduino provides Arduino-ESP32 3.x.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip ; Arduino-ESP32 3.3.12
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv ; 3 MB app, no OTA
board_build.f_cpu = 80000000L         ; Wi-Fi + TLS are fine at 80 MHz, saves battery

; The serial port is auto-detected. With several boards attached, set upload_port / monitor_port.
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
  bodmer/TFT_eSPI@2.5.43
  bblanchon/ArduinoJson@7.4.3

build_flags =
  -DCORE_DEBUG_LEVEL=1
  ; --- TFT_eSPI: TTGO T-Display (equivalent of User_Setups/Setup25_TTGO_T_Display.h) ---
  ; TFT_BL is deliberately not defined: the firmware drives the backlight with PWM itself.
  -DUSER_SETUP_LOADED=1
  -DST7789_DRIVER=1
  -DTFT_WIDTH=135
  -DTFT_HEIGHT=240
  -DCGRAM_OFFSET=1
  -DTFT_MOSI=19
  -DTFT_SCLK=18
  -DTFT_CS=5
  -DTFT_DC=16
  -DTFT_RST=23
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DLOAD_FONT7=1
  -DSMOOTH_FONT=1
  -DSPI_FREQUENCY=40000000
  -DDISABLE_ALL_LIBRARY_WARNINGS=1
